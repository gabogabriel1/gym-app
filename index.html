<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym App</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --modal-bg: #2C2C2E;
            --text-primary: #FFFFFF;
            --text-secondary: #EBEBF599;
            --accent-color: #0A84FF;
            --danger-color: #FF3B30;
            --edit-color: #34C759;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y; /* Bloquea el zoom del doble toque */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            padding-top: env(safe-area-inset-top);
            user-select: none;
            -webkit-user-select: none;
        }

        input, textarea {
            user-select: auto;
            -webkit-user-select: auto;
        }

        .view { display: none; }
        .view.active { display: block; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            margin-top: 20px;
        }

        h1 {
            font-size: 34px;
            font-weight: 700;
        }

        .btn-add {
            background-color: var(--accent-color);
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 28px;
            line-height: 1;
            padding-bottom: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .btn-back {
            color: var(--accent-color);
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 15px;
        }

        #rutinas-container, #ejercicios-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-wrapper {
            position: relative;
            border-radius: 14px;
            overflow: hidden; 
            background-color: transparent;
        }

        .action-bg-left, .action-bg-right {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%; 
            display: flex;
            align-items: center;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            z-index: 1;
        }
        .action-bg-left { 
            left: 0; 
            background-color: var(--edit-color); 
            justify-content: flex-start;
            padding-left: 25px;
        }
        .action-bg-right { 
            right: 0; 
            background-color: var(--danger-color); 
            justify-content: flex-end;
            padding-right: 25px;
        }

        .swipe-card {
            position: relative;
            z-index: 2; 
            background-color: var(--card-bg);
            padding: 18px 20px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 600;
        }

        .ejercicio-content {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-grow: 1;
        }

        .ejercicio-img {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            background-color: #3A3A3C;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .ejercicio-info h3 {
            font-size: 17px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .ejercicio-info p {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background-color: var(--modal-bg);
            width: 100%;
            max-width: 320px;
            padding: 24px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-box h2 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 5px;
        }

        .modal-box input {
            background-color: #1C1C1E;
            border: 1px solid #3A3A3C;
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 16px;
            width: 100%;
            outline: none;
        }

        .modal-box input:focus { border-color: var(--accent-color); }

        .modal-file-label {
            background-color: #3A3A3C;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-cancelar { background-color: #3A3A3C; color: white; }
        .btn-guardar { background-color: var(--accent-color); color: white; }
    </style>
</head>
<body>

    <!-- VISTA 1: Lista de Rutinas -->
    <div id="vista-rutinas" class="view active">
        <header>
            <h1>Mis Rutinas</h1>
            <div class="btn-add" id="btn-add-rutina">+</div>
        </header>
        <main id="rutinas-container"></main>
    </div>

    <!-- VISTA 2: Detalle de la Rutina (Ejercicios) -->
    <div id="vista-detalle" class="view">
        <div class="btn-back" onclick="volverARutinas()">‹ Volver</div>
        <header style="margin-top: 10px;">
            <h1 id="titulo-rutina-detalle">Rutina</h1>
            <div class="btn-add" id="btn-add-ejercicio">+</div>
        </header>
        <main id="ejercicios-container"></main>
    </div>

    <!-- MODAL: Crear Rutina -->
    <div id="modal-rutina" class="modal-overlay">
        <div class="modal-box">
            <h2>Nueva Rutina</h2>
            <input type="text" id="input-nombre-rutina" placeholder="Nombre (ej. Tren Superior)">
            <div class="modal-buttons">
                <button class="btn-cancelar" onclick="cerrarModalRutina()">Cancelar</button>
                <button class="btn-guardar" onclick="guardarRutina()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Crear/Editar Ejercicio -->
    <div id="modal-ejercicio" class="modal-overlay">
        <div class="modal-box">
            <h2 id="modal-titulo">Crear Ejercicio</h2>
            <input type="text" id="input-nombre" placeholder="Nombre (ej. Press de Banca)">
            <input type="number" id="input-series" placeholder="Número de series (ej. 4)">
            <input type="number" id="input-repeticiones" placeholder="Repeticiones por serie (ej. 10)">
            
            <label class="modal-file-label" id="label-foto">
                📷 Agregar foto (Opcional)
                <input type="file" id="input-foto" accept="image/*" style="display: none;">
            </label>

            <div class="modal-buttons">
                <button class="btn-cancelar" onclick="cerrarModalEjercicio()">Cancelar</button>
                <button class="btn-guardar" onclick="guardarEjercicio()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- EL TRUCO ESTÁ AQUÍ: EL ?v=2 OBLIGA A TU IPHONE A DESCARGAR EL NUEVO CÓDIGO -->
    <script src="app.js?v=2"></script>
</body>
</html>
