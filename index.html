<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym App</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --text-primary: #FFFFFF;
            --text-secondary: #EBEBF599;
            --accent-color: #0A84FF;
            --danger-color: #FF3B30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            padding-top: env(safe-area-inset-top);
        }

        /* Vistas (Pantallas) */
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            margin-top: 20px;
        }

        h1 {
            font-size: 34px;
            font-weight: 700;
        }

        .btn-add {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 28px;
            line-height: 1;
            padding-bottom: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 15px;
        }

        /* Contenedores de listas */
        #rutinas-container, #ejercicios-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Tarjetas de Rutinas con Swipe */
        .rutina-wrapper {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background-color: var(--danger-color);
        }

        .btn-delete {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 80px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            cursor: pointer;
        }

        .rutina-card {
            position: relative;
            z-index: 1;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        /* Tarjetas de Ejercicios */
        .ejercicio-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 14px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .ejercicio-img {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            background-color: #2C2C2E;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .ejercicio-info h3 {
            font-size: 17px;
            margin-bottom: 4px;
        }

        .ejercicio-info p {
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <!-- VISTA 1: Lista de Rutinas -->
    <div id="vista-rutinas" class="view active">
        <header>
            <h1>Mis Rutinas</h1>
            <button class="btn-add" onclick="crearRutina()">+</button>
        </header>
        <main id="rutinas-container">
            <!-- Inyectado por JS -->
        </main>
    </div>

    <!-- VISTA 2: Detalle de la Rutina (Ejercicios) -->
    <div id="vista-detalle" class="view">
        <button class="btn-back" onclick="volverARutinas()">‹ Volver</button>
        <header style="margin-top: 10px;">
            <h1 id="titulo-rutina-detalle">Rutina</h1>
            <button class="btn-add" onclick="crearEjercicio()">+</button>
        </header>
        <main id="ejercicios-container">
            <!-- Inyectado por JS -->
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
