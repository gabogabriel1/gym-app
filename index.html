<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Evita que el usuario haga zoom, sintiéndose más como una app nativa -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Gym App</title>
    
    <!-- Enlaces para que iOS la reconozca como App -->
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icon.jpg">
    
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; text-align: center; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>¡Mi App Funciona!</h1>
    <p>Esta es mi primera aplicación privada.</p>
    <script src="./app.js"></script>
</body>
</html>
