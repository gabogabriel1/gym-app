<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym App</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --text-primary: #FFFFFF;
            --text-secondary: #EBEBF599;
            --accent-color: #0A84FF;
            --danger-color: #FF3B30; /* Rojo iOS */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            padding-top: env(safe-area-inset-top);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        h1 {
            font-size: 34px;
            font-weight: 700;
        }

        .btn-add {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 28px;
            line-height: 1; /* Esto ayuda a centrar el + */
            padding-bottom: 4px; /* Ajuste óptico fino para iOS */
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #rutinas-container {
            display: flex;
            flex-direction: column;
        }

        /* Estructura para el Swipe to Delete */
        .rutina-wrapper {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background-color: var(--danger-color);
            margin-bottom: 15px; 
        }

        .btn-delete {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 80px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            cursor: pointer;
        }

        .rutina-card {
            position: relative;
            z-index: 1;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            /* La transición se controla desde JavaScript */
        }
    </style>
</head>
<body>

    <header>
        <h1>Mis Rutinas</h1>
        <button class="btn-add" onclick="crearRutina()">+</button>
    </header>

    <main id="rutinas-container">
        <!-- Las rutinas se inyectarán aquí -->
    </main>

    <script src="app.js"></script>
</body>
</html>
